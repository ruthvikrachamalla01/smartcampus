<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users - Smart Campus</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #f4f7fb;

            font-family: Arial, sans-serif;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            padding: 14px 0;

            box-shadow:
                0 2px 12px
                rgba(0,0,0,0.08);
        }


        .brand {

            font-size: 21px;

            font-weight: 700;
        }


        /* ================= HEADER ================= */

        .page-header {

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #084298
                );

            color: white;

            border-radius: 20px;

            padding: 35px;

            margin-top: 30px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.10);
        }


        .page-header h2 {

            font-weight: 700;
        }


        /* ================= STAT CARDS ================= */

        .stat-card {

            border: none;

            border-radius: 16px;

            background: white;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.07);

            transition: 0.2s;
        }


        .stat-card:hover {

            transform:
                translateY(-3px);
        }


        .stat-icon {

            width: 48px;

            height: 48px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;
        }


        .total-icon {

            background: #e7f0ff;

            color: #0d6efd;
        }


        .student-icon {

            background: #e5f8ed;

            color: #198754;
        }


        .staff-icon {

            background: #fff3cd;

            color: #856404;
        }


        .admin-icon {

            background: #eee7ff;

            color: #6f42c1;
        }


        .stat-number {

            font-size: 26px;

            font-weight: 700;

            margin-top: 12px;
        }


        .stat-label {

            color: #6c757d;

            font-size: 13px;

            font-weight: 600;
        }


        /* ================= FILTER ================= */

        .filter-card {

            border: none;

            border-radius: 16px;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.07);
        }


        /* ================= TABLE ================= */

        .table-card {

            border: none;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }


        .table {

            margin-bottom: 0;

            vertical-align: middle;
        }


        .table thead th {

            background: #212529;

            color: white;

            border: none;

            padding: 15px;

            white-space: nowrap;
        }


        .table tbody td {

            padding: 15px;
        }


        .table tbody tr {

            transition: 0.2s;
        }


        .table tbody tr:hover {

            background: #f8f9fa;
        }


        .user-id {

            color: #0d6efd;

            font-weight: 700;
        }


        .role-badge {

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;
        }


        /* ================= EMPTY ================= */

        .empty-state {

            padding: 50px;

            text-align: center;

            color: #6c757d;
        }


        .empty-icon {

            font-size: 50px;

            color: #0d6efd;
        }


        /* ================= FOOTER ================= */

        footer {

            background: #212529;

            color: white;

            text-align: center;

            padding: 28px;

            margin-top: 60px;
        }


        @media (max-width: 768px) {

            .page-header {

                padding: 28px 22px;
            }


            .page-header h2 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<!-- ================================================= -->
<!-- NAVBAR -->
<!-- ================================================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">


        <a
            href="admin-dashboard.html"
            class="navbar-brand brand">

            <i class="bi bi-building me-2"></i>

            Smart Campus Admin

        </a>


        <div>

            <a
                href="admin-dashboard.html"
                class="btn btn-outline-light btn-sm me-2">

                <i class="bi bi-speedometer2 me-1"></i>

                Dashboard

            </a>


            <button
                class="btn btn-danger btn-sm"
                onclick="logout()">

                <i class="bi bi-box-arrow-right me-1"></i>

                Logout

            </button>

        </div>

    </div>

</nav>



<!-- ================================================= -->
<!-- MAIN -->
<!-- ================================================= -->

<div class="container">


    <!-- HEADER -->

    <div class="page-header">

        <h2>

            <i class="bi bi-people me-2"></i>

            Manage Users

        </h2>


        <p class="mb-0">

            View and monitor all registered
            Smart Campus users.

        </p>

    </div>



    <!-- ================================================= -->
    <!-- STATISTICS -->
    <!-- ================================================= -->

    <div class="row g-3 mt-3">


        <!-- TOTAL -->

        <div class="col-6 col-md-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div
                        class="stat-icon total-icon">

                        <i class="bi bi-people"></i>

                    </div>


                    <div
                        id="totalUsers"
                        class="stat-number">

                        0

                    </div>


                    <div class="stat-label">

                        Total Users

                    </div>

                </div>

            </div>

        </div>



        <!-- STUDENTS -->

        <div class="col-6 col-md-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div
                        class="stat-icon student-icon">

                        <i class="bi bi-person"></i>

                    </div>


                    <div
                        id="studentUsers"
                        class="stat-number">

                        0

                    </div>


                    <div class="stat-label">

                        Students

                    </div>

                </div>

            </div>

        </div>



        <!-- STAFF -->

        <div class="col-6 col-md-3">

            <div class="card stat-card">

                <div
                    class="card-body">

                    <div
                        class="stat-icon staff-icon">

                        <i class="bi bi-person-gear"></i>

                    </div>


                    <div
                        id="staffUsers"
                        class="stat-number">

                        0

                    </div>


                    <div class="stat-label">

                        Maintenance Staff

                    </div>

                </div>

            </div>

        </div>



        <!-- ADMIN -->

        <div class="col-6 col-md-3">

            <div class="card stat-card">

                <div class="card-body">

                    <div
                        class="stat-icon admin-icon">

                        <i class="bi bi-shield-check"></i>

                    </div>


                    <div
                        id="adminUsers"
                        class="stat-number">

                        0

                    </div>


                    <div class="stat-label">

                        Administrators

                    </div>

                </div>

            </div>

        </div>


    </div>



    <!-- ================================================= -->
    <!-- FILTER -->
    <!-- ================================================= -->

    <div class="card filter-card mt-4">

        <div class="card-body">

            <div class="row g-3">


                <!-- SEARCH -->

                <div class="col-md-8">

                    <label
                        class="form-label fw-semibold">

                        Search Users

                    </label>


                    <div class="input-group">

                        <span
                            class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>


                        <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search by ID, name or email..."
                            onkeyup="filterUsers()">

                    </div>

                </div>



                <!-- ROLE -->

                <div class="col-md-4">

                    <label
                        class="form-label fw-semibold">

                        Filter by Role

                    </label>


                    <select
                        id="roleFilter"
                        class="form-select"
                        onchange="filterUsers()">

                        <option value="">
                            All Roles
                        </option>

                        <option value="STUDENT">
                            Student
                        </option>

                        <option value="STAFF">
                            Maintenance Staff
                        </option>

                        <option value="ADMIN">
                            Administrator
                        </option>

                    </select>

                </div>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- TABLE -->
    <!-- ================================================= -->

    <div class="card table-card mt-4">

        <div class="table-responsive">

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Role</th>

                    </tr>

                </thead>


                <tbody id="usersTable">

                    <tr>

                        <td
                            colspan="4"
                            class="text-center p-5">

                            <div
                                class="spinner-border
                                       text-primary">

                            </div>


                            <div class="mt-3">

                                Loading users...

                            </div>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>



<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<footer>

    <h6 class="mb-2">

        <i class="bi bi-building me-1"></i>

        Smart Campus Complaint and
        Maintenance Management System

    </h6>


    <small class="text-white-50">

        Administrator Portal

    </small>

</footer>



<script>


// =====================================================
// ADMIN LOGIN CHECK
// =====================================================

const userId =
    localStorage.getItem("userId");


const userRole =
    localStorage.getItem("userRole");


if (
    !userId ||
    userRole !== "ADMIN"
) {

    alert(
        "Please login as Administrator."
    );

    window.location.href =
        "login.html";

}



let allUsers = [];



// =====================================================
// LOAD USERS
// =====================================================

function loadUsers() {


    fetch("/api/users")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load users"
                );

            }

            return response.json();

        })


        .then(users => {


            allUsers =
                users;


            updateStatistics(
                users
            );


            displayUsers(
                users
            );

        })


        .catch(error => {

            console.error(error);


            document.getElementById(
                "usersTable"
            ).innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="text-danger
                               text-center p-5">

                        <i
                            class="bi
                                   bi-exclamation-circle
                                   fs-3">

                        </i>


                        <div class="mt-2">

                            Failed to load users.

                            Please check whether
                            Spring Boot is running.

                        </div>

                    </td>

                </tr>

            `;

        });

}



// =====================================================
// STATISTICS
// =====================================================

function updateStatistics(
    users
) {


    let students = 0;

    let staff = 0;

    let admins = 0;



    users.forEach(
        user => {


            const role =
                String(
                    user.role || ""
                ).toUpperCase();


            if (
                role === "STUDENT"
            ) {

                students++;

            }

            else if (
                role === "STAFF"
            ) {

                staff++;

            }

            else if (
                role === "ADMIN"
            ) {

                admins++;

            }

        }
    );



    document.getElementById(
        "totalUsers"
    ).textContent =
        users.length;


    document.getElementById(
        "studentUsers"
    ).textContent =
        students;


    document.getElementById(
        "staffUsers"
    ).textContent =
        staff;


    document.getElementById(
        "adminUsers"
    ).textContent =
        admins;

}



// =====================================================
// DISPLAY USERS
// =====================================================

function displayUsers(
    users
) {


    const table =
        document.getElementById(
            "usersTable"
        );


    table.innerHTML = "";



    if (
        users.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td colspan="4">

                    <div class="empty-state">

                        <div class="empty-icon">

                            <i
                                class="bi bi-person-x">
                            </i>

                        </div>


                        <h5 class="fw-bold mt-3">

                            No Users Found

                        </h5>


                        <p class="mb-0">

                            No users match your
                            search or filter.

                        </p>

                    </div>

                </td>

            </tr>

        `;

        return;

    }



    users.forEach(
        user => {


            const role =
                String(
                    user.role || "-"
                ).toUpperCase();



            let roleClass =
                "bg-secondary";


            if (
                role === "STUDENT"
            ) {

                roleClass =
                    "bg-success";

            }

            else if (
                role === "STAFF"
            ) {

                roleClass =
                    "bg-warning text-dark";

            }

            else if (
                role === "ADMIN"
            ) {

                roleClass =
                    "bg-primary";

            }



            let displayRole =
                role;


            if (
                role === "STAFF"
            ) {

                displayRole =
                    "MAINTENANCE STAFF";

            }

            else if (
                role === "ADMIN"
            ) {

                displayRole =
                    "ADMINISTRATOR";

            }



            const row =
                document.createElement(
                    "tr"
                );



            row.innerHTML = `

                <td>

                    <span class="user-id">

                        #${user.id}

                    </span>

                </td>


                <td>

                    <strong>

                        ${escapeHtml(
                            user.name ||
                            "Not Provided"
                        )}

                    </strong>

                </td>


                <td>

                    ${escapeHtml(
                        user.email ||
                        "Not Provided"
                    )}

                </td>


                <td>

                    <span
                        class="badge
                               ${roleClass}
                               role-badge">

                        ${displayRole}

                    </span>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}



// =====================================================
// SEARCH + ROLE FILTER
// =====================================================

function filterUsers() {


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const role =
        document.getElementById(
            "roleFilter"
        ).value;



    const filtered =
        allUsers.filter(
            user => {


                const searchText = `

                    ${user.id}

                    ${user.name || ""}

                    ${user.email || ""}

                `
                .toLowerCase();



                const matchesSearch =
                    searchText.includes(
                        search
                    );



                const matchesRole =
                    !role ||
                    String(
                        user.role || ""
                    ).toUpperCase()
                    === role;



                return (
                    matchesSearch &&
                    matchesRole
                );

            }
        );



    displayUsers(
        filtered
    );

}



// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.clear();

    window.location.href =
        "login.html";

}



// =====================================================
// INITIAL LOAD
// =====================================================

loadUsers();


</script>


</body>

</html>
