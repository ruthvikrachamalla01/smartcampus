<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback - Smart Campus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- Navbar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Smart Campus
        </span>

        <a href="student-dashboard.html"
           class="btn btn-light">

            Dashboard

        </a>

    </div>

</nav>



<!-- Feedback Form -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3>
                        Complaint Feedback
                    </h3>

                </div>


                <div class="card-body">

                    <form id="feedbackForm">


                        <!-- Complaint ID -->

                        <div class="mb-3">

                            <label class="form-label">
                                Complaint ID
                            </label>

                            <input
                                type="number"
                                id="complaintId"
                                class="form-control"
                                placeholder="Enter Complaint ID"
                                required>

                        </div>



                        <!-- Rating -->

                        <div class="mb-3">

                            <label class="form-label">
                                Rating
                            </label>

                            <select
                                id="rating"
                                class="form-select"
                                required>

                                <option value="">
                                    -- Select Rating --
                                </option>

                                <option value="5">
                                    ⭐⭐⭐⭐⭐ 5 - Excellent
                                </option>

                                <option value="4">
                                    ⭐⭐⭐⭐ 4 - Good
                                </option>

                                <option value="3">
                                    ⭐⭐⭐ 3 - Average
                                </option>

                                <option value="2">
                                    ⭐⭐ 2 - Poor
                                </option>

                                <option value="1">
                                    ⭐ 1 - Very Poor
                                </option>

                            </select>

                        </div>



                        <!-- Comment -->

                        <div class="mb-3">

                            <label class="form-label">
                                Your Feedback
                            </label>

                            <textarea
                                id="comment"
                                class="form-control"
                                rows="4"
                                placeholder="Write your feedback..."
                                required>
                            </textarea>

                        </div>



                        <!-- Submit -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Submit Feedback

                        </button>

                    </form>


                    <!-- Message -->

                    <div
                        id="message"
                        class="mt-3 text-center">
                    </div>


                </div>

            </div>

        </div>

    </div>

</div>



<script>


// Get logged-in user ID

const userId =
    localStorage.getItem("userId");


// Check login

if (!userId) {

    alert(
        "Please login first."
    );

    window.location.href =
        "login.html";

}



// Submit feedback

document
    .getElementById("feedbackForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const feedback = {

                complaintId:
                    Number(
                        document.getElementById(
                            "complaintId"
                        ).value
                    ),

                userId:
                    Number(userId),

                rating:
                    Number(
                        document.getElementById(
                            "rating"
                        ).value
                    ),

                comment:
                    document.getElementById(
                        "comment"
                    ).value

            };


            fetch(
                "/api/feedback",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            feedback
                        )

                }
            )

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to submit feedback"
                    );

                }

                return response.json();

            })

            .then(data => {

                document.getElementById(
                    "message"
                ).innerHTML = `

                    <div
                        class="alert alert-success">

                        Feedback submitted
                        successfully! ⭐

                    </div>

                `;


                document
                    .getElementById(
                        "feedbackForm"
                    )
                    .reset();

            })

            .catch(error => {

                console.error(error);

                document.getElementById(
                    "message"
                ).innerHTML = `

                    <div
                        class="alert alert-danger">

                        Failed to submit feedback.

                    </div>

                `;

            });

        }
    );


</script>


</body>
</html>
