<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Campus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #0d6efd,
                #6610f2
            );
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .register-header {
            background: #212529;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .register-header h2 {
            margin-bottom: 5px;
            font-weight: 600;
        }

        .register-header p {
            margin: 0;
            color: #ced4da;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .register-btn {
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .brand-icon {
            font-size: 42px;
        }

        .login-link {
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text {
            color: #6c757d;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="register-container">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-lg register-card">

                    <!-- Header -->

                    <div class="register-header">

                        <div class="brand-icon">
                            🏫
                        </div>

                        <h2>
                            Smart Campus
                        </h2>

                        <p>
                            Create your account
                        </p>

                    </div>


                    <!-- Body -->

                    <div class="card-body p-4 p-md-5">

                        <form id="registerForm">

                            <!-- Name -->

                            <div class="mb-3">

                                <label
                                    for="name"
                                    class="form-label fw-semibold">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    minlength="3"
                                    required>

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label fw-semibold">

                                    Password

                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        placeholder="Create a password"
                                        minlength="6"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="togglePassword">

                                        Show

                                    </button>

                                </div>

                                <small class="text-muted">

                                    Password must contain at least
                                    6 characters.

                                </small>

                            </div>


                            <!-- Role -->

                            <div class="mb-4">

                                <label
                                    for="role"
                                    class="form-label fw-semibold">

                                    Select Role

                                </label>

                                <select
                                    id="role"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        -- Select Role --
                                    </option>

                                    <option value="STUDENT">
                                        Student
                                    </option>

                                    <option value="STAFF">
                                        Maintenance Staff
                                    </option>

                                    <option value="ADMIN">
                                        Administrator
                                    </option>

                                </select>

                            </div>


                            <!-- Register Button -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 register-btn">

                                Create Account

                            </button>

                        </form>


                        <!-- Message -->

                        <div
                            id="message"
                            class="mt-3 text-center">
                        </div>


                        <!-- Login -->

                        <div class="text-center mt-4">

                            <span class="text-muted">
                                Already have an account?
                            </span>

                            <a
                                href="login.html"
                                class="login-link">

                                Login

                            </a>

                        </div>

                    </div>

                </div>


                <!-- Footer -->

                <div class="text-center mt-3">

                    <span class="footer-text">

                        Smart Campus Complaint and
                        Maintenance Management System

                    </span>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* ===============================
   SHOW / HIDE PASSWORD
================================ */

document
    .getElementById("togglePassword")
    .addEventListener("click", function() {

        const password =
            document.getElementById("password");

        if (password.type === "password") {

            password.type = "text";

            this.textContent = "Hide";

        } else {

            password.type = "password";

            this.textContent = "Show";

        }

    });


/* ===============================
   REGISTRATION
================================ */

document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name")
                .value.trim();

        const email =
            document.getElementById("email")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;

        const role =
            document.getElementById("role")
                .value;


        /* ===============================
           BASIC VALIDATION
        ================================ */

        if (name.length < 3) {

            showMessage(
                "Please enter a valid name.",
                "danger"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "danger"
            );

            return;

        }


        if (!role) {

            showMessage(
                "Please select a role.",
                "danger"
            );

            return;

        }


        const user = {

            name: name,

            email: email,

            password: password,

            role: role

        };


        /* ===============================
           SEND DATA TO BACKEND
        ================================ */

        fetch("/api/users", {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify(user)

        })

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Registration failed"
                );

            }

            return response.json();

        })

        .then(data => {

            showMessage(

                `
                <div class="alert alert-success">

                    <strong>
                        Registration Successful! 🎉
                    </strong>

                    <br>

                    Your account has been created.

                    <br>

                    Role:
                    <strong>
                        ${escapeHtml(data.role)}
                    </strong>

                    <br><br>

                    <a
                        href="login.html"
                        class="btn btn-success btn-sm">

                        Go to Login

                    </a>

                </div>
                `,

                "success",

                true

            );


            document
                .getElementById("registerForm")
                .reset();

        })

        .catch(error => {

            console.error(error);

            showMessage(

                "Registration failed. Please check your details and try again.",

                "danger"

            );

        });

    });


/* ===============================
   MESSAGE FUNCTION
================================ */

function showMessage(message, type, html = false) {

    const messageBox =
        document.getElementById("message");

    if (html) {

        messageBox.innerHTML = message;

    } else {

        messageBox.innerHTML =

            `
            <div class="alert alert-${type}">
                ${message}
            </div>
            `;

    }

}


/* ===============================
   HTML ESCAPE
================================ */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
